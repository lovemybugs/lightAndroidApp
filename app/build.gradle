plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 如果你要用自己的签名打包正式版，在项目根目录放一个 keystore.properties：
//   storeFile=htmlstudy.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// 没有这个文件时，release 会打包成未签名 APK（不会报错）。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()

android {
    namespace 'com.htmlstudy.library'
    compileSdk 34

    defaultConfig {
        applicationId 'com.htmlstudy.library'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.5'
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources.excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json'
        ]
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric 首次跑测试要下载 android-all 运行时；指向国内镜像快很多
                systemProperty 'robolectric.dependency.repo.id', 'aliyun'
                systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
            }
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
